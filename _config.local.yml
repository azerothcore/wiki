# Local previews only (used by test_locally).
# _config.yml's plugins without jekyll-redirect-from, which breaks pages on Windows and macOS.
plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-sitemap
 - jekyll-avatar
 - jemoji
 - jekyll-mentions

# Leaves out the translations, which cuts the build to about a third.
# Remove 'docs/es' and 'docs/cn' from this list to build them too.
exclude: ['wiki', 'test_locally.bat', 'test_locally.sh', 'Gemfile', 'Gemfile.lock', 'docs/es', 'docs/cn']
